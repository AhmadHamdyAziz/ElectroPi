<mat-card class="actions-card">

  <mat-card-header>
    <mat-card-title>Ticket Actions</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <div class="actions">

      <!-- Assign agent -->
      <mat-form-field appearance="outline">
        <mat-label>Assigned Agent</mat-label>

        <mat-select>
          <mat-option [value]="null">
            Unassigned
          </mat-option>

          <!-- Agents will be loaded here -->
        </mat-select>
      </mat-form-field>


      <!-- Change state -->
      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>

        <mat-select [value]="ticket().status">

          @for (state of states; track state.value) {
            <mat-option [value]="state.value">
              {{ state.label }}
            </mat-option>
          }

        </mat-select>
      </mat-form-field>


      <!-- Change priority -->
      <mat-form-field appearance="outline">
        <mat-label>Priority</mat-label>

        <mat-select [value]="ticket().priority">

          @for (priority of priorities; track priority.value) {
            <mat-option [value]="priority.value">
              {{ priority.label }}
            </mat-option>
          }

        </mat-select>
      </mat-form-field>


      <div class="action-buttons">

        <button
          mat-flat-button
          type="button">
          <mat-icon>save</mat-icon>
          Save Changes
        </button>

        <button
          mat-stroked-button
          type="button">
          <mat-icon>check_circle</mat-icon>
          Resolve Ticket
        </button>

        <button
          mat-stroked-button
          type="button">
          <mat-icon>lock</mat-icon>
          Close Ticket
        </button>

      </div>

    </div>

  </mat-card-content>

</mat-card>
