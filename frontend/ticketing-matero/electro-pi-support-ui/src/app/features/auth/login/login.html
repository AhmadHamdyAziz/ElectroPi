<div class="login-container">

  <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title>
        ElectroPi Support
      </mat-card-title>

      <mat-card-subtitle>
        Sign in to your account
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>

      @if (error(); as errorMessage) {
        <div class="login-error">
          {{ errorMessage }}
        </div>
      }

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>

        <input
          matInput
          type="email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>

        <input
          matInput
          type="password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
        />
      </mat-form-field>

    </mat-card-content>

    <mat-card-actions>

      <button
        mat-flat-button
        color="primary"
        type="button"
        [disabled]="loading()"
        (click)="login()">

        @if (loading()) {
          Signing in...
        } @else {
          Sign in
        }

      </button>

    </mat-card-actions>

  </mat-card>

</div>
